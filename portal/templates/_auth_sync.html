{% if request and request.query_params and request.query_params.get('auth_sync') %}
<script>
  {% if current_user or user or user_menu or is_admin %}
  if (typeof BroadcastChannel !== 'undefined') {
    try {
      const authChannel = new BroadcastChannel('voxbento_auth');
      authChannel.postMessage('logged_in');
      authChannel.close();
    } catch (e) {}
  }
  {% endif %}
  try {
    const cleanUrl = new URL(window.location.href);
    cleanUrl.searchParams.delete('auth_sync');
    window.history.replaceState({}, document.title, cleanUrl.pathname + (cleanUrl.search ? cleanUrl.search : '') + cleanUrl.hash);
  } catch (e) {}
</script>
{% endif %}
